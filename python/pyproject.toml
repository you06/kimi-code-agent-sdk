[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-code-agent-sdk"
version = "0.1.0"
description = "Python client for controlling Kimi Code through the stdio SDK protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moonshot AI" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

